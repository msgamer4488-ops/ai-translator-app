name: Build Android APK

# Runs whenever you push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.example --project-name ai_language_translator_pro

      - name: Add required Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />#' "$MANIFEST"

      - name: Set SDK properties globally
        run: |
          # Write SDK configurations directly into local.properties
          cat << 'EOF' >> android/local.properties
          flutter.minSdkVersion=23
          flutter.compileSdkVersion=36
          flutter.targetSdkVersion=36
          EOF

          # Enable compileSdk suppression flag for modern AGP
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Disable R8 minification via Gradle CLI
        run: |
          # Pass -P flags directly during build to bypass build.gradle editing
          flutter pub get

      - name: Build release APK
        run: flutter build apk --release --extra-front-end-options=--no-g3-lint

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
