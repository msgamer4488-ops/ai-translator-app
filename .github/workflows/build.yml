name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.example --project-name ai_language_translator_pro

      - name: Add required Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />#' "$MANIFEST"

      - name: Set Android SDK configurations
        run: |
          cat << 'EOF' >> android/gradle.properties
          android.suppressUnsupportedCompileSdk=36
          EOF

          cat << 'EOF' >> android/local.properties
          flutter.minSdkVersion=23
          flutter.compileSdkVersion=36
          flutter.targetSdkVersion=36
          EOF

      - name: Configure ProGuard for ML Kit
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class io.flutter.plugin.** { *; }
          -dontwarn io.flutter.plugin.**
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
