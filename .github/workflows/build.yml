name: Build Android APK

# Runs whenever you push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android project
        # Only needed because this repo ships lib/ + pubspec.yaml only.
        # --org can be changed to your own reverse-domain identifier.
        run: flutter create . --platforms=android --org com.example --project-name ai_language_translator_pro

      - name: Add required Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Set minSdkVersion (ML Kit / speech_to_text need 21+)
        run: |
          GRADLE_FILE=android/app/build.gradle.kts
                if [ ! -f "$GRADLE_FILE" ]; 
          then
              GRADLE_FILE=android/app/build.gradle; fi
          sed -i 's/flutter.minSdkVersion/23/' "$GRADLE_FILE"
          sed -i 's/flutter.compileSdkVersion/36/' "$GRADLE_FILE"

          sed -i 's/flutter.targetSdkVersion/36/' "$GRADLE_FILE"
      - name: Disable R8 minification (avoids R8/plugin compatibility failure) 
        run: |
             GRADLE_FILE=android/app/build.gradle.kts if [ ! -f "$GRADLE_FILE" ];
             then 
             GRADLE_FILE=android/app/build.gradle; fi 
             sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' "$GRADLE_FILE" 
             sed -i 's/isShrinkResources = true/isShrinkResources = false/' "$GRADLE_FILE" 
             sed -i 's/minifyEnabled true/minifyEnabled false/' "$GRADLE_FILE" 
             sed -i 's/shrinkResources true/shrinkResources false/' "$GRADLE_FILE"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
