name: Build Android APK

# Runs whenever you push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android project
        # Only needed because this repo ships lib/ + pubspec.yaml only.
        run: flutter create . --platforms=android --org com.example --project-name ai_language_translator_pro

      - name: Add required Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Force compileSdkVersion 36 and set SDK versions
        run: |
          # Force compileSdkVersion 36 on all subprojects/plugins
          ROOT_GRADLE=$(ls android/build.gradle.kts android/build.gradle 2>/dev/null | head -n 1)
          if [[ "$ROOT_GRADLE" == *.kts ]]; then
            printf '\nsubprojects {\n    afterEvaluate {\n        if (project.hasProperty("android")) {\n            configure<com.android.build.gradle.BaseExtension> {\n                compileSdkVersion(36)\n            }\n        }\n    }\n}\n' >> "$ROOT_GRADLE"
          else
            printf '\nsubprojects {\n    afterEvaluate {\n        if (project.hasProperty("android")) {\n            android {\n                compileSdkVersion 36\n            }\n        }\n    }\n}\n' >> "$ROOT_GRADLE"
          fi

          # Update app-level gradle properties
          APP_GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n 1)
          sed -i "s/flutter.minSdkVersion/23/" "$APP_GRADLE"
          sed -i "s/flutter.compileSdkVersion/36/" "$APP_GRADLE"
          sed -i "s/flutter.targetSdkVersion/36/" "$APP_GRADLE"

      - name: Force-disable R8 minification
        run: |
          APP_GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n 1)
          if [[ "$APP_GRADLE" == *.kts ]]; then
            printf '\nandroid {\n    buildTypes {\n        getByName("release") {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }\n    }\n}\n' >> "$APP_GRADLE"
          else
            printf '\nandroid {\n    buildTypes {\n        release {\n            minifyEnabled false\n            shrinkResources false\n        }\n    }\n}\n' >> "$APP_GRADLE"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
