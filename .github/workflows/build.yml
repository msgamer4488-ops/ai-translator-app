name: Build Android APK

# Runs whenever you push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.example --project-name ai_language_translator_pro

      - name: Add required Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />#' "$MANIFEST"

      - name: Configure ProGuard and SDK overrides via Python
        run: |
          python3 -c '
          import os, glob

          # 1. Write ProGuard rules for ML Kit and Flutter plugins
          proguard_content = """
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class io.flutter.plugin.** { *; }
          -dontwarn io.flutter.plugin.**
          """
          with open("android/app/proguard-rules.pro", "w") as f:
              f.write(proguard_content)

          # 2. Add flags in gradle.properties
          with open("android/gradle.properties", "a") as f:
              f.write("\nandroid.suppressUnsupportedCompileSdk=36\n")

          # 3. Add SDK levels in local.properties
          with open("android/local.properties", "a") as f:
              f.write("\nflutter.minSdkVersion=23\nflutter.compileSdkVersion=36\nflutter.targetSdkVersion=36\n")

          # 4. Disable R8 minification safely in app build file
          app_gradles = glob.glob("android/app/build.gradle*")
          if app_gradles:
              target = app_gradles[0]
              with open(target, "a") as f:
                  if target.endswith(".kts"):
                      f.write("\nandroid { buildTypes { getByName(\"release\") { isMinifyEnabled = false; isShrinkResources = false; proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\") } } }\n")
                  else:
                      f.write("\nandroid { buildTypes { release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\" } } }\n")

          # 5. Safely override compileSdk across subprojects without using afterEvaluate
          root_gradles = glob.glob("android/build.gradle*")
          if root_gradles:
              target = root_gradles[0]
              with open(target, "a") as f:
                  if target.endswith(".kts"):
                      f.write("\nsubprojects { project.configurations.all { resolutionStrategy.eachDependency { if (requested.group == \"com.android.tools.build\") { } } }; plugins.withId(\"com.android.library\") { (extensions.findByName(\"android\") as? com.android.build.gradle.BaseExtension)?.compileSdkVersion(36) } }\n")
                  else:
                      f.write("\nsubprojects { plugins.withId(\"com.android.library\") { project.android.compileSdkVersion 36 } }\n")
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
