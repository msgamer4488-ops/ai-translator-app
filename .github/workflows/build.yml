name: Build Android APK

# Runs whenever you push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.example --project-name ai_language_translator_pro

      - name: Add required Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />#' "$MANIFEST"

      - name: Patch Gradle and SDK via Python
        run: |
          python3 -c '
          import os, glob

          # 1. Update properties
          with open("android/gradle.properties", "a") as f:
              f.write("\nandroid.suppressUnsupportedCompileSdk=36\nandroid.enableR8=false\n")

          with open("android/local.properties", "a") as f:
              f.write("\nflutter.minSdkVersion=23\nflutter.compileSdkVersion=36\nflutter.targetSdkVersion=36\n")

          # 2. Disable R8 in app build.gradle / build.gradle.kts
          app_gradles = glob.glob("android/app/build.gradle*")
          if app_gradles:
              target = app_gradles[0]
              with open(target, "a") as f:
                  if target.endswith(".kts"):
                      f.write("\nandroid { buildTypes { getByName(\"release\") { isMinifyEnabled = false; isShrinkResources = false } } }\n")
                  else:
                      f.write("\nandroid { buildTypes { release { minifyEnabled false; shrinkResources false } } }\n")

          # 3. Patch settings.gradle / settings.gradle.kts for all subprojects
          settings_files = glob.glob("android/settings.gradle*")
          if settings_files:
              target = settings_files[0]
              with open(target, "a") as f:
                  if target.endswith(".kts"):
                      f.write("\ngradle.lifecycle.beforeProject { if (plugins.hasPlugin(\"com.android.library\")) { (extensions.findByName(\"android\") as? com.android.build.gradle.BaseExtension)?.compileSdkVersion(36) } }\n")
                  else:
                      f.write("\ngradle.beforeProject { p -> p.plugins.withId(\"com.android.library\") { p.android.compileSdkVersion 36 } }\n")
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
